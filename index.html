<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <!-- viewport-fit=cover: required under Android targetSdk 36 forced edge-to-edge.
       interactive-widget=resizes-content: soft-keyboard resize hint where supported.
       Both are inert on desktop WebView2. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>StreamNook</title>
  <!-- React DevTools connection - only loads in development -->
  <script>
    // Connect to React DevTools if running in development
    if (window.location.hostname === 'localhost' || window.location.hostname === 'tauri.localhost') {
      const script = document.createElement('script');
      script.src = 'http://localhost:8097';
      document.head.appendChild(script);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <!-- viewport-fit=cover is required on Android: targetSdk 36 enforces edge-to-edge
       with no opt-out, and without this opt-in every env(safe-area-inset-*) resolves
       to 0, so the UI draws under the status bar and the gesture pill.
       interactive-widget=resizes-content is the soft-keyboard resize hint where the
       engine supports it. No effect on desktop. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>StreamNook</title>
  <!-- React DevTools connection - dev builds only. `tauri.localhost` is the
       PRODUCTION origin on Android, so testing the hostname alone would fire this
       request on shipped phones; gate on the build flag instead. -->
  <script type="module">
    if (import.meta.env.DEV) {
      const script = document.createElement('script');
      script.src = 'http://localhost:8097';
      document.head.appendChild(script);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
